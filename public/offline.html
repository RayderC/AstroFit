<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a12">
<title>Offline · AstroFit</title>
<style>
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box;
    background-color: #0a0a12; color: #e8e8f0; text-align: center;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background-image: linear-gradient(rgba(168, 85, 247, 0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(168, 85, 247, 0.06) 1px, transparent 1px);
    background-size: 32px 32px;
  }
  h1 { font-size: 28px; margin: 0 0 8px; background: linear-gradient(90deg, #a855f7, #22d3ee); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p { color: #9a9ab0; font-size: 14px; line-height: 1.5; margin: 0 0 20px; max-width: 320px; }
  a { display: inline-block; padding: 10px 18px; border: 1px solid rgba(168, 85, 247, 0.6); border-radius: 8px; color: #fff; background: rgba(124, 14, 179, 0.5); text-decoration: none; font-size: 13px; font-weight: 700; }
</style>
</head>
<body>
  <main>
    <h1>AstroFit</h1>
    <p>You're offline and can't reach your server. Your workouts are safe there. Reconnect and try again.</p>
    <a href="/">Try again</a>
  </main>
</body>
</html>
